
<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrophyHunter Pro - 100% Completion Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes pulse-red {
            0%, 100% { border-color: rgba(244, 63, 94, 1); box-shadow: 0 0 5px rgba(244, 63, 94, 0.5); }
            50% { border-color: rgba(244, 63, 94, 0.2); box-shadow: 0 0 15px rgba(244, 63, 94, 0.2); }
        }
        
        .animate-pulse-red {
            animation: pulse-red 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Fast Completion Pulses */
        @keyframes pulse-emerald-subtle {
            0%, 100% { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 10px rgba(16, 185, 129, 0.1); }
            50% { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        }

        @keyframes pulse-emerald-intense {
            0%, 100% { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); transform: scale(1); }
            50% { border-color: rgba(16, 185, 129, 1); box-shadow: 0 0 35px rgba(16, 185, 129, 0.5); transform: scale(1.02); }
        }

        .near-completion-subtle {
            animation: pulse-emerald-subtle 3s ease-in-out infinite;
            border-width: 2px !important;
        }

        .near-completion-intense {
            animation: pulse-emerald-intense 1.5s ease-in-out infinite;
            border-width: 3px !important;
            z-index: 10;
        }

        .full-clear-glow {
            border-color: #10b981 !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            border-width: 2px !important;
        }

        .neon-border {
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .neon-text-emerald {
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.15;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        body.lock-scroll {
            overflow: hidden !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@heroicons/react/": "https://esm.sh/@heroicons/react@^2.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#050505] text-zinc-100 min-h-screen selection:bg-emerald-500/30">
    <div class="scanlines"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
